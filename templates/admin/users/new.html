{% extends "base.html" %}
{% block title %}Add New Person – User Management{% endblock %}

{% block content %}
<div class="mb-3">
    <a href="{{ url_for('admin_users.list_users') }}" class="text-decoration-none">
        <i class="bi bi-arrow-left"></i> Back to Users
    </a>
</div>

<div class="row justify-content-center">
    <div class="col-lg-8">
        <div class="card shadow-sm border-0">
            <div class="card-header bg-white py-3">
                <h5 class="mb-0">Add New Person</h5>
                <small class="text-muted">Create a user account — personal details are set here once</small>
            </div>
            <div class="card-body p-4">
                <form method="POST">
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label for="name" class="form-label">Full Name</label>
                            <input type="text" class="form-control" id="name" name="name" required
                                   value="{{ form.get('name', '') if form else '' }}">
                        </div>
                        <div class="col-md-6">
                            <label for="email" class="form-label">Email ID</label>
                            <input type="email" class="form-control" id="email" name="email" required
                                   value="{{ form.get('email', '') if form else '' }}">
                        </div>
                        <div class="col-12">
                            <label for="address" class="form-label">Address</label>
                            <textarea class="form-control" id="address" name="address" rows="2" required>{{ form.get('address', '') if form else '' }}</textarea>
                        </div>
                        <div class="col-md-6">
                            <label for="mobile_number" class="form-label">Mobile Number</label>
                            <input type="tel" class="form-control" id="mobile_number" name="mobile_number" required
                                   placeholder="+91 98765 43210"
                                   value="{{ form.get('mobile_number', '') if form else '' }}">
                        </div>
                        <div class="col-md-6">
                            <label for="position" class="form-label">Position</label>
                            <select class="form-select" id="position" name="position" required>
                                <option value="" disabled {% if not form or not form.get('position') %}selected{% endif %}>
                                    Select position…
                                </option>
                                {% for pos in positions %}
                                <option value="{{ pos }}"
                                    {% if form and form.get('position') == pos %}selected{% endif %}>
                                    {{ pos }}
                                </option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label for="password" class="form-label">Temporary Password</label>
                            <input type="password" class="form-control" id="password" name="password"
                                   required minlength="6" placeholder="Minimum 6 characters">
                        </div>
                    </div>
                    <div class="d-flex gap-2 mt-4">
                        <button type="submit" class="btn btn-primary">
                            <i class="bi bi-person-plus"></i> Create User
                        </button>
                        <a href="{{ url_for('admin_users.list_users') }}" class="btn btn-outline-secondary">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
